[package]
name = "stickler"
version = "0.1.0"
edition = "2021"
description = "Stickler is a command line tool that reviews code against named rules, checks a diff with a built in checker, and prints readings over verdicts that decision model routes recorded while judging a change set against those rules."

[lib]
name = "stickler"
path = "rust/src/lib.rs"

[[bin]]
name = "stickler"
path = "rust/src/main.rs"

[[bin]]
name = "codepoint_scan"
path = "rust/src/bin/codepoint_scan.rs"

