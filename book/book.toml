[book]
title = "Stickler Handbook"
authors = ["David Engelmann"]
language = "en"
src = "src"

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
site-url = "/stickler/"
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/david-engelmann/stickler"
additional-css = ["theme/custom.css"]
no-section-label = true
