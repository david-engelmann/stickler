<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 549" width="920" height="549" role="img"><title>stickler - deterministic Python diff gate and borderline verdict ledger</title><style>.sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }@keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }.live-dot { animation: pulseGlow 2.8s ease-in-out infinite; }@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }</style><rect x="1" y="1" width="918" height="547" rx="14" fill="#0f0e0c" stroke="#2e2b25" stroke-width="1.5"/>
        <text x="36" y="44" class="sans" font-size="13" font-weight="700" fill="#a6a095" letter-spacing="0.8">TWO-STAGE CODE REVIEW PIPELINE</text>
        <circle cx="880" cy="39" r="5" fill="#f59e0b" class="live-dot"/>
        <text x="866" y="44" text-anchor="end" class="mono" font-size="11" fill="#f59e0b">OFFLINE DETERMINISTIC</text>

        <rect x="36" y="60" width="410" height="172" rx="8" fill="#1f1d19" stroke="#2e2b25"/>
        <text x="54" y="84" class="sans" font-size="13" font-weight="700" fill="#f2eee6">Stage 1 · Built-in 6-Shape Diff Checker</text>
        <rect x="346" y="69" width="84" height="20" rx="10" fill="#2b1212"/>
        <text x="388" y="83" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#ef4444">SENT BACK</text>
        <text x="54" y="108" class="mono" font-size="11.5" fill="#ef4444">+     except:             (smell · bare except)</text>
        <text x="54" y="126" class="mono" font-size="11.5" fill="#10b981">  -&gt;  except Exception:</text>
        <text x="54" y="150" class="mono" font-size="11.5" fill="#ef4444">+         print(total)    (smell · print call)</text>
        <text x="54" y="168" class="mono" font-size="11.5" fill="#10b981">  -&gt;      logger.debug(total)</text>
        <text x="54" y="196" class="sans" font-size="11.5" fill="#a6a095">6 rules · bare except · print call · mutable default</text>
        <text x="54" y="214" class="sans" font-size="11.5" fill="#a6a095">placeholder name · call default · class attribute</text>

        <rect x="466" y="60" width="418" height="172" rx="8" fill="#1f1d19" stroke="#2e2b25"/>
        <text x="484" y="84" class="sans" font-size="13" font-weight="700" fill="#f2eee6">Stage 2 · Borderline Flags &amp; Verdict Seat</text>
        <rect x="772" y="69" width="96" height="20" rx="10" fill="#2b200d"/>
        <text x="820" y="83" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#f59e0b">2 CONTESTED</text>
        <text x="484" y="110" class="mono" font-size="11.5" fill="#f2eee6">ledger.py, line 6 · near placeholder name</text>
        <text x="484" y="129" class="mono" font-size="11" fill="#f59e0b">  jev-1.13.0        -&gt; stickler (conf 0.81)</text>
        <text x="484" y="147" class="mono" font-size="11" fill="#10b981">  openai/gpt-6-luna -&gt; clean    (conf 0.77)</text>
        <line x1="484" y1="162" x2="866" y2="162" stroke="#2e2b25"/>
        <text x="484" y="183" class="mono" font-size="11.5" fill="#a6a095">18 borderline flags · 14 stickler · 2 clean · 2 unjudged</text>
        <text x="484" y="204" class="sans" font-size="11.5" fill="#a6a095">Confidence below 0.50 abstains on that verdict seat</text>
        <rect x="36" y="252" width="848" height="269" rx="10" fill="#12110f" stroke="#2e2b25"/><circle cx="56" cy="272" r="5" fill="#ef4444"/><circle cx="72" cy="272" r="5" fill="#f59e0b"/><circle cx="88" cy="272" r="5" fill="#10b981"/><text x="460" y="276" text-anchor="middle" class="mono" font-size="11" fill="#9c9588">stickler - verified offline examples</text><line x1="36" y1="288" x2="884" y2="288" stroke="#2a2722"/><text x="54" y="310" class="mono" font-size="11.5" fill="#f59e0b">$ stickler check examples/smelly.diff</text><text x="54" y="329" class="mono" font-size="11.5" fill="#f2eee6">Review of smelly.diff</text><text x="54" y="348" class="mono" font-size="11.5" fill="#f87171">Verdict, sent back</text><text x="54" y="367" class="mono" font-size="11.5" fill="#f2eee6">Objections, 2</text><text x="54" y="386" class="mono" font-size="11.5" fill="#9c9588">Objection 1, smell  | Flaw, The added line catches every exception with a bare except clause</text><text x="54" y="405" class="mono" font-size="11.5" fill="#34d399">Rewrite,     except Exception:</text><text x="54" y="424" class="mono" font-size="11.5" fill="#9c9588">Objection 2, smell  | Flaw, The added line sends diagnostics through a print call</text><text x="54" y="443" class="mono" font-size="11.5" fill="#34d399">Rewrite,         logger.debug(total)</text><text x="54" y="462" class="mono" font-size="11.5" fill="#f59e0b">$ stickler contested examples/contested.json</text><text x="54" y="481" class="mono" font-size="11.5" fill="#f2eee6">Set, constructed round 4 example  -&gt;  ledger.py, line 6  |  cache.py, line 15</text><text x="54" y="500" class="mono" font-size="11.5" fill="#34d399">Sets read, 3  |  Flags read, 18  |  Contested flags, 2  |  Sets with contested flags, 1</text></svg>
